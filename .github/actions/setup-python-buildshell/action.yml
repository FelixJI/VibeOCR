name: Setup Python + build-shell.lock
description: Setup Python 3.13 + install hash-pinned build-shell dependencies. Callers must checkout first.

# NOTE: this action intentionally does NOT run actions/checkout. Every caller
# already checks out the exact ref it needs (ci.yml jobs check out the PR/push
# ref; release.yml's build job checks out the release tag). A bare
# `actions/checkout@v5` here (with no `ref`) would default to the triggering
# branch and silently clobber a caller's intentional tag checkout — that is
# exactly what broke the v0.6.2 release: the build job checked out refs/tags/v0.6.2,
# then this action re-checked out main (0.6.1), so the wheels built as 0.6.1 and
# bind_backend_artifact.py failed with "wheel version mismatch".
# Callers must also checkout before invoking this action so the runner can
# resolve the local composite action.yml (see ci.yml header comments).

runs:
  using: "composite"
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.13"
    - shell: bash
      run: pip install --require-hashes -r requirements/build-shell.lock
