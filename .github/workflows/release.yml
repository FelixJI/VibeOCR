# VibeOCR 自动打包发版流程
#
# 触发：推送 v* 格式的 tag（由本地 `bump_version.py --to-main` 创建并 push）
# 产物：Windows 便携版 zip + sha256，上传到对应 tag 的 GitHub Release
#
# 依赖策略：CI 不跑 uv sync（会拉数 GB 的 paddle/torch CUDA 包），
# 而是显式安装 PyInstaller 打包真正需要 import 的最小依赖集。
# paddle/torch 在打包时被 --exclude-module 排除（见 bump_version.py
# EXCLUDED_PACKAGES），version.json 的依赖版本从 pyproject.toml 解析，
# 不依赖实际安装的包。

name: Release

on:
  push:
    tags:
      - "v*"

# 同一 tag 重复推送时取消旧 run，避免并发打包
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # softprops/action-gh-release 创建 Release 需要

jobs:
  build:
    name: Build & Release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          # tag 形如 refs/tags/v0.1.7 → version=0.1.7
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' 不符合 vX.Y.Z 格式"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "解析到版本号: $tag"

      - name: Install minimal build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # PyInstaller 实际需要 import 的全部第三方包（paddle/torch 被
          # --exclude-module 排除，不在此列）。版本约束宽松，由 PyPI 解析最新兼容版。
          pip install \
            pyinstaller \
            pyside6 \
            pillow \
            numpy \
            markdown \
            qasync \
            httpx \
            pymupdf \
            fonttools \
            "qrcode[pil]" \
            python-barcode \
            opencv-contrib-python \
            pyzbar

      - name: Build (PyInstaller via bump_version.py)
        shell: bash
        # PYTHONUTF8=1 确保 bump_version.py 及其子进程（PyInstaller 等）在
        # Windows runner 上统一走 UTF-8，避免打印中文时 cp1252 编码崩溃。
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/bump_version.py --rebuild "${{ steps.version.outputs.version }}" --force

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: python
        # Windows runner 默认 stdout 编码为 cp1252，print 中文会抛
        # UnicodeEncodeError。PYTHONUTF8=1 强制整个 Python 进程走 UTF-8 IO。
        env:
          PYTHONUTF8: "1"
        run: |
          import re, sys
          from pathlib import Path

          version = "${{ steps.version.outputs.version }}"
          changelog = Path("CHANGELOG.md")
          body = ""
          if changelog.exists():
              content = changelog.read_text(encoding="utf-8")
              pattern = rf"##\s+\[{re.escape(version)}\].*?(?=\n##\s|$)"
              m = re.search(pattern, content, re.DOTALL)
              if m:
                  body = m.group(0).strip()

          if not body:
              body = f"VibeOCR v{version}"

          # 写到文件，避免多行字符串在 GITHUB_OUTPUT 里的转义问题
          Path("release_notes.md").write_text(body, encoding="utf-8")
          print(f"提取到 {len(body)} 字符的 release notes")

      - name: Upload to GitHub Release
        # v3 运行在 Node 24 runtime 上，消除 Node 20 弃用警告
        # （v2 不会得到 Node 24 更新，见 softprops/action-gh-release#654）。
        uses: softprops/action-gh-release@v3
        with:
          # body 走文件，避免 GitHub Actions 多行字符串注入陷阱
          body_path: release_notes.md
          files: |
            dist/VibeOCR-v${{ steps.version.outputs.version }}-win64.zip
            dist/VibeOCR-v${{ steps.version.outputs.version }}-win64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------
      # Gitee 同步（代码镜像 + Release 产物）
      # -------------------------------------------------------------------
      # 两步都读 secrets.GITEE_TOKEN；token 缺失或任一步失败时只发 ::warning::，
      # 不阻断 job —— 保证 GitHub 发版永远成功，Gitee 可事后补。
      # owner/repo 与 src/vibeocr/services/update_service.py 的 _GITEE_OWNER/_GITEE_REPO 对齐。

      - name: Mirror code to Gitee (all refs)
        id: gitee_mirror
        # actions/checkout@v5 默认浅克隆（fetch-depth:1）且只 fetch 触发的那一个 ref，
        # 做不了 --mirror。这里显式 fetch 全部分支 + tag 到本地 refs，再 --mirror 推。
        shell: bash
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::warning::未配置 secrets.GITEE_TOKEN，跳过 Gitee 代码镜像"
            exit 0
          fi

          set +e
          # 补齐完整历史（已完整时该命令无害）
          git fetch --unshallow 2>/dev/null
          # 拉取所有 heads + tag 到本地 refs（checkout 默认不带这些 refspec）
          git fetch --force origin \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

          GITEE_URL="https://oauth2:${GITEE_TOKEN}@gitee.com/felixjii/vibeocr.git"
          # --mirror 推送所有 refs（heads + tags），并删除远端已不存在的引用。
          # 首次推送到空仓库同样适用。Gitee 网络偶发超时，最多重试 3 次。
          status=1
          for attempt in 1 2 3; do
            git push --mirror "$GITEE_URL" && { status=0; break; }
            echo "Gitee push 第 $attempt 次失败 (exit $?)，等待后重试..."
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          if [ $status -ne 0 ]; then
            echo "::warning::Gitee 代码镜像失败 (3 次重试后仍失败)，不阻断发版"
            exit 0
          fi
          echo "Gitee 代码镜像成功"

      - name: Sync release assets to Gitee
        id: gitee_release
        shell: python
        env:
          PYTHONUTF8: "1"
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          token = os.environ.get("GITEE_TOKEN", "")
          if not token:
              print("::warning::未配置 secrets.GITEE_TOKEN，跳过 Gitee Release 同步")
              sys.exit(0)

          version = os.environ["VERSION"]
          owner, repo = "felixjii", "vibeocr"
          tag = f"v{version}"
          api_base = f"https://gitee.com/api/v5/repos/{owner}/{repo}"

          zip_path = Path(f"dist/VibeOCR-v{version}-win64.zip")
          sha_path = Path(f"dist/VibeOCR-v{version}-win64.zip.sha256")
          notes = Path("release_notes.md")
          body = notes.read_text(encoding="utf-8") if notes.exists() else f"VibeOCR v{version}"

          def request_with_retry(req, *, attempts=3, base_delay=10):
              """带指数退避的 urlopen 包装。Gitee 网络偶发超时/5xx，重试可解决。"""
              last_err = None
              for i in range(1, attempts + 1):
                  try:
                      return urllib.request.urlopen(req, timeout=req.timeout if hasattr(req, "timeout") else 60)
                  except (urllib.error.URLError, TimeoutError, ConnectionError) as e:
                      last_err = e
                      if i == attempts:
                          raise
                      delay = base_delay * i
                      print(f"  请求失败 ({e})，{delay}s 后第 {i + 1} 次尝试...")
                      time.sleep(delay)
              raise last_err  # 不可达

          try:
              # 1) 创建 Release —— 若同名 tag 的 Release 已存在则复用，避免重跑时重复创建。
              #    （契约对齐 bump_version.py:_upload_to_gitee）
              data = json.dumps({
                  "access_token": token,
                  "tag_name": tag,
                  "name": tag,
                  "body": body,
                  "target_commitish": "main",
              }).encode("utf-8")
              req = urllib.request.Request(
                  f"{api_base}/releases",
                  data=data,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              req.timeout = 60
              try:
                  resp = request_with_retry(req)
                  release = json.loads(resp.read().decode("utf-8"))
                  resp.close()
                  release_id = release["id"]
                  print(f"Gitee Release 创建成功 id={release_id}")
              except urllib.error.HTTPError as e:
                  # 409/422 等通常表示该 tag 的 release 已存在 → 列出后复用
                  if e.code in (409, 422):
                      list_req = urllib.request.Request(
                          f"{api_base}/releases/tags/{tag}?access_token={token}",
                          method="GET",
                      )
                      list_req.timeout = 60
                      resp = request_with_retry(list_req)
                      release = json.loads(resp.read().decode("utf-8"))
                      resp.close()
                      release_id = release["id"]
                      print(f"Gitee Release 已存在，复用 id={release_id}")
                  else:
                      raise

              # 2) 上传 zip + sha256 附件。大文件写超时是常见失败点，重试 + 长超时。
              boundary = "----vibeocr-boundary"
              for path in (zip_path, sha_path):
                  if not path.exists():
                      print(f"::warning::附件不存在，跳过: {path}")
                      continue
                  with open(path, "rb") as f:
                      file_bytes = f.read()
                  parts = [
                      f"--{boundary}\r\n".encode(),
                      (f'Content-Disposition: form-data; name="access_token"\r\n\r\n'
                       f"{token}\r\n").encode(),
                      f"--{boundary}\r\n".encode(),
                      (f'Content-Disposition: form-data; name="file"; '
                       f'filename="{path.name}"\r\n'
                       f"Content-Type: application/octet-stream\r\n\r\n").encode(),
                      file_bytes,
                      f"\r\n--{boundary}--\r\n".encode(),
                  ]
                  req = urllib.request.Request(
                      f"{api_base}/releases/{release_id}/attach_files",
                      data=b"".join(parts),
                      headers={"Content-Type": f"multipart/form-data; boundary={boundary}"},
                      method="POST",
                  )
                  # zip 较大，给足 300s；重试 3 次。
                  req.timeout = 300
                  resp = request_with_retry(req, attempts=3, base_delay=15)
                  resp.read()
                  resp.close()
                  print(f"  上传附件成功: {path.name}")

              print("Gitee Release 同步完成")
          except Exception as e:
              # 失败不阻断：GitHub 发版已成功，Gitee 可事后补
              print(f"::warning::Gitee Release 同步失败: {e}")
              sys.exit(0)
