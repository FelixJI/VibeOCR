# VibeOCR 自动打包发版流程
#
# 触发：定时（每天 UTC 07:30）/ 推送 v* tag / 手动 workflow_dispatch / workflow_call。
# 定时与手动触发经 detect→quality-gates→prepare-release 自动编排版本号并推 tag；
# tag 推送与 workflow_call 跳过编排，直接 quality-gates→build。
# 产物：Windows 便携版 zip + sha256，上传到对应 tag 的 GitHub Release
#
# 依赖策略：CI 不跑完整 uv sync（会拉数 GB 的 paddle/torch CUDA 包），
# 而是安装 hash-pinned 的质量/构建壳依赖。正式产物由 .NET publish +
# UI-free Supervisor + protocol-v2 staging 组成，不再发布 PyInstaller/PySide6 UI。

name: Release

on:
  schedule:
    # GitHub Actions cron 使用 UTC；北京时间 15:30 = UTC 07:30。
    - cron: "30 7 * * *"
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_bump:
        description: "选择要增加的版本号：patch（x.y.Z）/ minor（x.Y.0）/ major（X.0.0）。仅 schedule/dispatch 路径生效。"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      build_variants:
        description: "生成哪些安装包：pyside6（Classic 主力，PyInstaller）/ winui（Next 开发预览，dotnet）/ all（两者）。默认 pyside6。"
        required: false
        default: "pyside6"
        type: choice
        options:
          - pyside6
          - winui
          - all
  workflow_call:
    inputs:
      version:
        description: "要发布的 x.y.z 版本；调用方须先创建对应 vX.Y.Z tag。"
        required: true
        type: string
      build_variants:
        description: "生成 pyside6、winui 或 all。"
        required: false
        default: "pyside6"
        type: string

concurrency:
  # 定时发版用固定 group 且不取消（避免漏发版）；tag push / 手动 / workflow_call
  # 按版本或 ref 分组并取消旧 run（同 tag 并发只保留最新）。
  group: release-${{ github.event_name == 'schedule' && 'scheduled' || (inputs.version || github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write  # softprops/action-gh-release 创建 Release 需要

env:
  PYTHONPATH: "${{ github.workspace }}/packages/vibeocr-contracts-py/src;${{ github.workspace }}/packages/vibeocr-runtime-client-py/src;${{ github.workspace }}/packages/vibeocr-backend/src;${{ github.workspace }}/apps/vibeocr-pyside/src"
  # 控制本次发版生成哪些安装包。取值：
  #   pyside6  仅 PySide6 Classic（PyInstaller 打 main.py，VibeOCR-Classic-*.zip）
  #   winui    仅 WinUI Next（dotnet publish，VibeOCR-Next-*.zip，开发预览）
  #   all      两者都打
  # tag 推送触发时读这里的默认值；workflow_dispatch 手动触发时读
  # inputs.build_variants（缺省回退到这里）。
  #
  # ⚠️ 当前默认仅打包 pyside6（Classic，主力产品）。WinUI Next 处于早期开发、
  # 基本不可用，不随 tag 自动发版；需要时手动 workflow_dispatch 选 winui/all。
  # 想让 tag 发版也带上 WinUI，把这里改成 all 即可。
  BUILD_VARIANTS_DEFAULT: "pyside6"

jobs:
  detect:
    name: Detect unreleased main commits
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_release: ${{ steps.unreleased.outputs.should_release }}
      current_version: ${{ steps.unreleased.outputs.current_version }}
      commit_count: ${{ steps.unreleased.outputs.commit_count }}
    steps:
      - name: Require main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::请在 GitHub Actions 手动触发页面选择 main 分支"
            exit 1
          fi

      - name: Checkout triggering main commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Detect commits after current release point
        id: unreleased
        shell: bash
        run: |
          version="$(
            sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"/\1/p' \
              apps/vibeocr-pyside/pyproject.toml | head -n 1
          )"
          if [[ -z "$version" ]]; then
            echo "::error::无法从 Classic pyproject.toml 解析当前版本"
            exit 1
          fi

          release_commit="$(git rev-parse "refs/tags/v${version}^{commit}" 2>/dev/null || true)"
          if [[ -z "$release_commit" ]]; then
            count="$(git rev-list --count HEAD)"
          else
            count="$(git rev-list --count "${release_commit}..HEAD")"
          fi

          should_release=false
          if (( count > 0 )); then
            should_release=true
          fi

          echo "current_version=$version" >> "$GITHUB_OUTPUT"
          echo "commit_count=$count" >> "$GITHUB_OUTPUT"
          echo "should_release=$should_release" >> "$GITHUB_OUTPUT"
          echo "当前版本 v${version} 之后有 ${count} 个 main 提交"

  quality-gates:
    name: Quality gates (reuse CI)
    needs: detect
    # schedule/dispatch 路径：detect 先判断 should_release；
    # tag push / workflow_call 路径无 detect（needs detect 被跳过 → result 'skipped'），
    # 此 job 仍需运行，故同时放行 should_release == 'true' 与 detect 被跳过两种情况。
    if: >-
      needs.detect.result == 'skipped' ||
      needs.detect.outputs.should_release == 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  prepare-release:
    name: Prepare and trigger release
    needs: [detect, quality-gates]
    if: >-
      needs.detect.outputs.should_release == 'true' &&
      needs.quality-gates.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout the quality-gated commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned uv
        run: python -m pip install uv==0.11.28

      - name: Configure release identity
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare next release
        id: release
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.detect.outputs.current_version }}
          VERSION_BUMP: ${{ inputs.version_bump || 'patch' }}
        run: |
          actual_version="$(
            sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"/\1/p' \
              apps/vibeocr-pyside/pyproject.toml | head -n 1
          )"
          if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::质量门前后版本不一致：expected=$EXPECTED_VERSION actual=$actual_version"
            exit 1
          fi

          case "$VERSION_BUMP" in
            patch|minor|major) ;;
            *)
              echo "::error::未知版本增量：$VERSION_BUMP"
              exit 1
              ;;
          esac

          python scripts/bump_version.py "$VERSION_BUMP" --no-edit --no-push --no-build

          next_version="$(
            sed -n 's/^version = "\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)"/\1/p' \
              apps/vibeocr-pyside/pyproject.toml | head -n 1
          )"
          git rev-parse --verify "refs/tags/v${next_version}^{commit}"
          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Atomically push main and release tag
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/v${VERSION}:refs/tags/v${VERSION}"

      - name: Write release summary
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT_COUNT: ${{ needs.detect.outputs.commit_count }}
          VERSION_BUMP: ${{ inputs.version_bump || 'patch' }}
        run: |
          {
            echo "### 已触发自动发版"
            echo
            echo "- 待发布 main 提交：${COMMIT_COUNT}"
            echo "- 版本增量：${VERSION_BUMP}"
            echo "- 新版本：v${VERSION}"
            echo "- 后续构建：下方 build job"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & Release (Windows)
    needs: [detect, quality-gates, prepare-release]
    # 三条路径汇聚到 build：
    #   schedule/dispatch：detect→quality-gates→prepare-release 全跑，build 取 prepare-release.version
    #   tag push / workflow_call：detect/prepare-release 被跳过（result 'skipped'），quality-gates 已过，
    #     build 从 tag（github.ref_name）或 inputs.version 解析版本。
    if: >-
      (needs.prepare-release.result == 'success') ||
      (needs.detect.result == 'skipped' && needs.quality-gates.result == 'success')
    runs-on: windows-latest
    # 发版构建发布：构建 wheel + Classic(PyInstaller)/可选 WinUI(dotnet) 打包 +
    # 上传 + 镜像，正常 ~5-10min；45min 宽裕上限。测试归 ci.yml（quality-gates 已过）。
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 三路径版本来源不同，统一解析后 checkout 对应 tag：
          #   prepare-release.outputs.version（schedule/dispatch，含 bump）→ 裸 X.Y.Z，format 补 v 前缀
          #   inputs.version（workflow_call，调用方已建 tag）→ 裸 X.Y.Z，format 补 v 前缀
          #   github.ref（tag push）→ 已是完整 refs/tags/vX.Y.Z，直接用，避免重复 v 前缀
          ref: ${{ needs.prepare-release.outputs.version != '' && format('refs/tags/v{0}', needs.prepare-release.outputs.version) || (inputs.version != '' && format('refs/tags/v{0}', inputs.version) || github.ref) }}

      - uses: ./.github/actions/setup-python-buildshell

      - name: Set up .NET 10.0.302
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.302"

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          # 三路径版本来源优先级：prepare-release.outputs.version（schedule/dispatch）>
          # inputs.version（workflow_call）> GITHUB_REF_NAME（tag push，去掉前导 v）。
          prep="${{ needs.prepare-release.outputs.version }}"
          input="${{ inputs.version }}"
          tag="${prep:-${input:-${GITHUB_REF_NAME#v}}}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本 '$tag' 不符合 X.Y.Z 格式"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "解析到版本号: $tag"

      - name: Resolve which installers to build
        id: variants
        shell: bash
        run: |
          # 决定本次生成哪些安装包。优先级：
          #   1) workflow_dispatch 手动触发的 inputs.build_variants（缺省为空）
          #   2) env.BUILD_VARIANTS_DEFAULT（tag 推送 / 手动未填时回退到这里）
          # 归一化成 build_pyside / build_winui 两个布尔输出，供后续步骤的 if: 判定。
          input="${{ inputs.build_variants }}"
          variants="${input:-${BUILD_VARIANTS_DEFAULT}}"
          echo "选择的安装包组合: $variants"
          case "$variants" in
            pyside6) build_pyside=true;  build_winui=false ;;
            winui)   build_pyside=false; build_winui=true  ;;
            all)     build_pyside=true;  build_winui=true  ;;
            *)
              echo "::error::未知 build_variants='$variants'（应为 pyside6 / winui / all）"
              exit 1
              ;;
          esac
          echo "build_pyside=$build_pyside" >> "$GITHUB_OUTPUT"
          echo "build_winui=$build_winui"  >> "$GITHUB_OUTPUT"
          echo "→ PySide6 经典版: $build_pyside"
          echo "→ WinUI 次世代版: $build_winui"

      - name: Install build frontends
        shell: bash
        run: pip install build==1.3.0 hatchling==1.27.0

      - name: Restore .NET solution
        shell: pwsh
        run: |
          dotnet restore src/dotnet/VibeOCR.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: ./.github/actions/build-workspace-wheels

      - name: Build PySide6 Classic (PyInstaller)
        if: ${{ steps.variants.outputs.build_pyside == 'true' }}
        shell: pwsh
        # PYTHONUTF8=1 确保 bump_version.py 及其子进程在
        # Windows runner 上统一走 UTF-8，避免打印中文时 cp1252 编码崩溃。
        # --frontend pyside：PyInstaller 打 main.py（PySide6 Classic）。e7fe825
        # 后 _run_build 一度只走 WinUI(dotnet)，v0.4.29 起 Classic 发版全挂；
        # 现双路径恢复：pyside=PyInstaller、winui=dotnet 各走原生工具链。
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/bump_version.py --rebuild "${{ steps.version.outputs.version }}" --force --frontend pyside
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bind backend wheel → VibeOCR-Classic-*.zip
        if: ${{ steps.variants.outputs.build_pyside == 'true' }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          python scripts/bind_backend_artifact.py --frontend pyside --version $version --input "dist/VibeOCR-v$version-win64.zip" --wheel-dir dist/wheels --output "dist/VibeOCR-Classic-v$version-win64.zip"
          python scripts/verify_pyside_artifact.py "dist/VibeOCR-Classic-v$version-win64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build WinUI Next (.NET publish)
        if: ${{ steps.variants.outputs.build_winui == 'true' }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          ./scripts/build_winui_release.ps1 -Version $version -WheelDirectory dist/wheels -OutputDir dist/winui-next
          Compress-Archive -Path dist/winui-next/* -DestinationPath "dist/VibeOCR-Next-v$version-win64.zip" -Force
          $hash = (Get-FileHash "dist/VibeOCR-Next-v$version-win64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VibeOCR-Next-v$version-win64.zip" | Set-Content "dist/VibeOCR-Next-v$version-win64.zip.sha256" -Encoding ascii

      - name: Verify PySide Classic artifact
        if: ${{ steps.variants.outputs.build_pyside == 'true' }}
        shell: pwsh
        run: |
          python scripts/verify_pyside_artifact.py "dist/VibeOCR-Classic-v${{ steps.version.outputs.version }}-win64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify WinUI Next artifact
        if: ${{ steps.variants.outputs.build_winui == 'true' }}
        shell: pwsh
        run: |
          ./scripts/verify_winui_artifact.ps1 -Artifact "dist/VibeOCR-Next-v${{ steps.version.outputs.version }}-win64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify table semantics in release artifacts
        if: ${{ steps.variants.outputs.build_pyside == 'true' || steps.variants.outputs.build_winui == 'true' }}
        shell: pwsh
        run: |
          if ('${{ steps.variants.outputs.build_pyside }}' -eq 'true') {
            python scripts/verify_table_artifact.py "dist/VibeOCR-Classic-v${{ steps.version.outputs.version }}-win64.zip" --report-dir reports/table-artifact/classic
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ('${{ steps.variants.outputs.build_winui }}' -eq 'true') {
            python scripts/verify_table_artifact.py "dist/VibeOCR-Next-v${{ steps.version.outputs.version }}-win64.zip" --report-dir reports/table-artifact/winui
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Upload table artifact diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: table-artifact-diagnostics
          path: |
            reports/table-release-contract
            reports/table-artifact
          if-no-files-found: warn
          retention-days: 14

      - name: Package Python wheelhouse
        shell: pwsh
        run: |
          Compress-Archive -Path dist/wheels/*.whl -DestinationPath "dist/VibeOCR-Python-wheels-v${{ steps.version.outputs.version }}.zip" -Force
          $hash = (Get-FileHash "dist/VibeOCR-Python-wheels-v${{ steps.version.outputs.version }}.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VibeOCR-Python-wheels-v${{ steps.version.outputs.version }}.zip" | Set-Content "dist/VibeOCR-Python-wheels-v${{ steps.version.outputs.version }}.zip.sha256" -Encoding ascii

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: python
        # Windows runner 默认 stdout 编码为 cp1252，print 中文会抛
        # UnicodeEncodeError。PYTHONUTF8=1 强制整个 Python 进程走 UTF-8 IO。
        env:
          PYTHONUTF8: "1"
        run: |
          import re, sys
          from pathlib import Path

          version = "${{ steps.version.outputs.version }}"
          changelog = Path("CHANGELOG.md")
          body = ""
          if changelog.exists():
              content = changelog.read_text(encoding="utf-8")
              pattern = rf"##\s+\[{re.escape(version)}\].*?(?=\n##\s|$)"
              m = re.search(pattern, content, re.DOTALL)
              if m:
                  body = m.group(0).strip()

          if not body:
              body = f"VibeOCR v{version}"

          # 写到文件，避免多行字符串在 GITHUB_OUTPUT 里的转义问题
          Path("release_notes.md").write_text(body, encoding="utf-8")
          print(f"提取到 {len(body)} 字符的 release notes")

      - name: Upload to GitHub Release
        # v3 运行在 Node 24 runtime 上，消除 Node 20 弃用警告
        # （v2 不会得到 Node 24 更新，见 softprops/action-gh-release#654）。
        uses: softprops/action-gh-release@v3
        with:
          # workflow_call 的 github.ref 不是 tag，必须显式指定目标 tag。
          tag_name: v${{ steps.version.outputs.version }}
          # body 走文件，避免 GitHub Actions 多行字符串注入陷阱
          body_path: release_notes.md
          # files 用 glob（而非字面路径）：当某个安装包本次未生成（见
          # steps.variants 的 build_pyside / build_winui 开关）时，对应的 glob
          # 匹配为空，配合 fail_on_unmatched_files: false（默认）只记 warning、
          # 不让上传步失败。version 仍通过 tag 锁定，不会误传历史版本。
          fail_on_unmatched_files: false
          files: |
            dist/VibeOCR-Classic-v${{ steps.version.outputs.version }}-win64.zip
            dist/VibeOCR-Classic-v${{ steps.version.outputs.version }}-win64.zip.sha256
            dist/VibeOCR-Next-v${{ steps.version.outputs.version }}-win64.zip
            dist/VibeOCR-Next-v${{ steps.version.outputs.version }}-win64.zip.sha256
            dist/VibeOCR-Python-wheels-v${{ steps.version.outputs.version }}.zip
            dist/VibeOCR-Python-wheels-v${{ steps.version.outputs.version }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------
      # 历史版本清理：发版成功后删除更旧的 GitHub Release，保留最近 5 个
      # -------------------------------------------------------------------
      # 仅删 Release 对象 + 资产（zip/sha256），不删 git tag（--cleanup-tag=false
      # 显式表意）。保留发布历史可追溯，只释放 Release 存储。
      # gh CLI 预装于 windows-latest；GITHUB_TOKEN 由 permissions: contents: write
      # 授权删除。整步 best-effort：单个删除失败仅 ::warning::，不阻断发版
      # （与下方 CNB 镜像步容错策略一致）。

      - name: Cleanup old releases (keep 5)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # 按 semver 数值降序列出已发布 release 的 tag（排除 draft），
          # 保留前 5 个，其余删除。tonumber 按数值比较（v0.10.0 > v0.9.0），
          # 避免字典序把 v0.10.0 排在 v0.9.0 之前。
          mapfile -t all_tags < <(gh release list --json tagName,isDraft \
            --jq '[.[] | select(.isDraft==false) | .tagName] | sort_by(
              ltrimstr("v") | split(".") | map(tonumber)
            ) | reverse | .[]')
          keep=5
          count=${#all_tags[@]}
          echo "共有 $count 个已发布 release，保留最近 $keep 个"
          if [ "$count" -le "$keep" ]; then
            echo "无需清理"
            exit 0
          fi
          deleted=0
          for tag in "${all_tags[@]:$keep}"; do
            echo "删除旧 release: $tag"
            if gh release delete "$tag" --yes --cleanup-tag=false 2>err.log; then
              deleted=$((deleted + 1))
            else
              echo "::warning::删除 release $tag 失败: $(cat err.log)"
            fi
          done
          echo "清理完成，删除了 $deleted 个旧 release"
          exit 0

      # -------------------------------------------------------------------
      # CNB 同步（代码镜像 + Release 产物）
      # -------------------------------------------------------------------
      # 读 secrets.CNB_TOKEN；token 缺失或任一步失败时只发 ::warning::，
      # 不阻断 job。生产仓 feljii/VibeOCR（与 about_tab._CNB_URL 对齐）。

      - name: Mirror code to CNB (all refs)
        id: cnb_mirror
        # actions/checkout@v5 默认浅克隆（fetch-depth:1）且只 fetch 触发的那一个 ref。
        # 这里显式 fetch 全部分支 + tag 到本地 refs，再用 --prune + 显式 refspec 推
        # （见下方说明，为何不用 --mirror）。
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if [ -z "$CNB_TOKEN" ]; then
            echo "::warning::未配置 secrets.CNB_TOKEN，跳过 CNB 代码镜像"
            exit 0
          fi

          set +e
          # 补齐完整历史（已完整时该命令无害）
          git fetch --unshallow 2>/dev/null
          # 拉取所有 heads + tag 到本地 refs（checkout 默认不带这些 refspec）
          git fetch --force origin \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

          CNB_URL="https://oauth2:${CNB_TOKEN}@cnb.cool/feljii/VibeOCR.git"
          # 只推 heads + tags（带 --prune：远端已删的分支/tag 同步删除，等价于
          # --mirror 的清理语义）。不用 --mirror：它会连 refs/remotes/origin/*
          # 这类"远程跟踪引用"一起推，被远端以 "deny updating a hidden ref"
          # 拒收，导致 git exit 1 + 误判镜像失败。CNB 网络偶发超时，最多重试 3 次。
          status=1
          for attempt in 1 2 3; do
            git push --progress --prune "$CNB_URL" \
              '+refs/heads/*:refs/heads/*' \
              '+refs/tags/*:refs/tags/*' && { status=0; break; }
            echo "CNB push 第 $attempt 次失败 (exit $?)，等待后重试..."
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          if [ $status -ne 0 ]; then
            echo "::warning::CNB 代码镜像失败 (3 次重试后仍失败)，不阻断发版"
            exit 0
          fi
          echo "CNB 代码镜像成功"

