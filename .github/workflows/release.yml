# VibeOCR 自动打包发版流程
#
# 触发：推送 v* 格式的 tag（由本地 `bump_version.py` 创建并 push）
# 产物：Windows 便携版 zip + sha256，上传到对应 tag 的 GitHub Release
#
# 依赖策略：CI 不跑完整 uv sync（会拉数 GB 的 paddle/torch CUDA 包），
# 而是安装 hash-pinned 的质量/构建壳依赖。正式产物由 .NET publish +
# UI-free WorkerHost source staging 组成，不再发布 PyInstaller/PySide6 UI。

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_variants:
        description: "生成哪些安装包：pyside6（PySide6 经典版）/ winui（WinUI 次世代版）/ all（两者）"
        required: false
        default: "pyside6"
        type: choice
        options:
          - pyside6
          - winui
          - all

# 同一 tag 重复推送时取消旧 run，避免并发打包
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # softprops/action-gh-release 创建 Release 需要

env:
  # 控制本次发版生成哪些安装包。取值：
  #   pyside6  仅 PySide6 经典版（VibeOCR-Classic-*.zip）
  #   winui    仅 WinUI 次世代版（VibeOCR-Next-*.zip）
  #   all      两者都打
  # tag 推送触发时读这里的默认值；workflow_dispatch 手动触发时读
  # inputs.build_variants（缺省回退到这里）。默认仅打包 pyside6 版本，
  # 想让 tag 发版也带上 WinUI，把这里改成 all 即可。
  BUILD_VARIANTS_DEFAULT: "pyside6"

jobs:
  build:
    name: Build & Release (Windows)
    runs-on: windows-latest
    # 发版流程含 .NET 测试 + PySide 打包 + WinUI 打包 + 上传 + 镜像，
    # 正常 ~5-10min；45min 宽裕上限。dotnet test 同样可能因 App.Tests 挂起
    # （见 ci.yml winui job 注释），超时护栏避免烧满 6h 默认配额。
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up .NET 10.0.302
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.302"

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          # tag 形如 refs/tags/v0.1.7 → version=0.1.7
          tag="${GITHUB_REF_NAME#v}"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' 不符合 vX.Y.Z 格式"
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "解析到版本号: $tag"

      - name: Resolve which installers to build
        id: variants
        shell: bash
        run: |
          # 决定本次生成哪些安装包。优先级：
          #   1) workflow_dispatch 手动触发的 inputs.build_variants（缺省为空）
          #   2) env.BUILD_VARIANTS_DEFAULT（tag 推送 / 手动未填时回退到这里）
          # 归一化成 build_pyside / build_winui 两个布尔输出，供后续步骤的 if: 判定。
          input="${{ inputs.build_variants }}"
          variants="${input:-${BUILD_VARIANTS_DEFAULT}}"
          echo "选择的安装包组合: $variants"
          case "$variants" in
            pyside6) build_pyside=true;  build_winui=false ;;
            winui)   build_pyside=false; build_winui=true  ;;
            all)     build_pyside=true;  build_winui=true  ;;
            *)
              echo "::error::未知 build_variants='$variants'（应为 pyside6 / winui / all）"
              exit 1
              ;;
          esac
          echo "build_pyside=$build_pyside" >> "$GITHUB_OUTPUT"
          echo "build_winui=$build_winui"  >> "$GITHUB_OUTPUT"
          echo "→ PySide6 经典版: $build_pyside"
          echo "→ WinUI 次世代版: $build_winui"

      - name: Install minimal build dependencies (hash-pinned)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # 用带哈希的锁文件安装，确保 CI 构建可复现、无隐式漂移。
          # 锁文件由 uv pip compile --generate-hashes 生成（见 requirements/build-shell.in）。
          # 清单须与 bump_version.py 的 HIDDEN_IMPORTS 对齐——凡 HIDDEN_IMPORTS
          # 列出的包，CI 必须安装，否则 PyInstaller 找不到模块打不进 bundle。
          # fastapi/uvicorn/pymupdf(fitz) 不在此列：PDF 后端子进程由嵌入式 Python
          # 独立运行，不进主 exe（见 pdf_backend_client._resolve_python_exe）。
          # fitz 从主 exe 排除后,版本约束走 version.json,由便携 Python 安装。
          pip install --require-hashes -r requirements/build-shell.lock

      - name: Restore .NET solution
        shell: pwsh
        run: |
          dotnet restore src/dotnet/VibeOCR.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Python migration and release gates
        shell: pwsh
        run: |
          python -m pytest tests/contracts tests/worker_host tests/migration tests/parity tests/release_layout tests/application/test_pdf_ocr_orchestrator.py tests/test_compare_release_metrics.py tests/test_startup_metrics.py tests/test_collect_startup_metrics.py tests/test_soak_winui.py tests/test_update_replacer.py tests/test_bump_version.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Python style
        shell: pwsh
        run: |
          python -m ruff check src tests scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate complete .NET solution
        shell: pwsh
        run: |
          # build 整个解决方案（含 App + App.Tests，以捕获编译错误），但只 test
          # 两个契约层项目。App.Tests 测的是 WinUI 专属 ViewModel 层，不进
          # PySide6 发布包，且其 testhost 在 Session 0 runner 上会挂起（见
          # ci.yml winui job 注释）。仍可本地 `dotnet test src/dotnet/VibeOCR.slnx`
          # 手动验证 WinUI 层。
          dotnet build src/dotnet/VibeOCR.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/dotnet/VibeOCR.Contracts.Tests/VibeOCR.Contracts.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/dotnet/VibeOCR.Platform.Tests/VibeOCR.Platform.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate Web assets
        shell: pwsh
        run: |
          node --test tests/web/*.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate feature-parity matrix
        shell: bash
        run: |
          python tests/parity/validate_matrix.py docs/quality/feature-parity.md --require-pass
          python -m pytest tests/parity -q

      - name: Build shared backend wheel once
        shell: pwsh
        run: |
          python scripts/build_backend_wheel.py --output-dir dist/backend
          $wheel = (Get-ChildItem dist/backend/*.whl).FullName
          python scripts/verify_backend_wheel.py $wheel --manifest dist/backend/backend-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build PySide Classic release
        if: ${{ steps.variants.outputs.build_pyside == 'true' }}
        shell: pwsh
        # PYTHONUTF8=1 确保 bump_version.py 及其子进程在
        # Windows runner 上统一走 UTF-8，避免打印中文时 cp1252 编码崩溃。
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/bump_version.py --rebuild "${{ steps.version.outputs.version }}" --force
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bind backend wheel to PySide Classic artifact
        if: ${{ steps.variants.outputs.build_pyside == 'true' }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $wheel = (Get-ChildItem dist/backend/*.whl).FullName
          python scripts/bind_backend_artifact.py --frontend pyside --version $version --input "dist/VibeOCR-v$version-win64.zip" --backend-wheel $wheel --output "dist/VibeOCR-Classic-v$version-win64.zip"
          python scripts/verify_pyside_artifact.py "dist/VibeOCR-Classic-v$version-win64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build WinUI Next from the same backend wheel
        if: ${{ steps.variants.outputs.build_winui == 'true' }}
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $wheel = (Get-ChildItem dist/backend/*.whl).FullName
          ./scripts/build_winui_release.ps1 -Version $version -BackendWheel $wheel -OutputDir dist/winui-next
          Compress-Archive -Path dist/winui-next/* -DestinationPath "dist/VibeOCR-Next-v$version-win64.zip" -Force
          $hash = (Get-FileHash "dist/VibeOCR-Next-v$version-win64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  VibeOCR-Next-v$version-win64.zip" | Set-Content "dist/VibeOCR-Next-v$version-win64.zip.sha256" -Encoding ascii

      - name: Verify PySide Classic artifact
        if: ${{ steps.variants.outputs.build_pyside == 'true' }}
        shell: pwsh
        run: |
          python scripts/verify_pyside_artifact.py "dist/VibeOCR-Classic-v${{ steps.version.outputs.version }}-win64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify WinUI Next artifact
        if: ${{ steps.variants.outputs.build_winui == 'true' }}
        shell: pwsh
        run: |
          ./scripts/verify_winui_artifact.ps1 -Artifact "dist/VibeOCR-Next-v${{ steps.version.outputs.version }}-win64.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: python
        # Windows runner 默认 stdout 编码为 cp1252，print 中文会抛
        # UnicodeEncodeError。PYTHONUTF8=1 强制整个 Python 进程走 UTF-8 IO。
        env:
          PYTHONUTF8: "1"
        run: |
          import re, sys
          from pathlib import Path

          version = "${{ steps.version.outputs.version }}"
          changelog = Path("CHANGELOG.md")
          body = ""
          if changelog.exists():
              content = changelog.read_text(encoding="utf-8")
              pattern = rf"##\s+\[{re.escape(version)}\].*?(?=\n##\s|$)"
              m = re.search(pattern, content, re.DOTALL)
              if m:
                  body = m.group(0).strip()

          if not body:
              body = f"VibeOCR v{version}"

          # 写到文件，避免多行字符串在 GITHUB_OUTPUT 里的转义问题
          Path("release_notes.md").write_text(body, encoding="utf-8")
          print(f"提取到 {len(body)} 字符的 release notes")

      - name: Upload to GitHub Release
        # v3 运行在 Node 24 runtime 上，消除 Node 20 弃用警告
        # （v2 不会得到 Node 24 更新，见 softprops/action-gh-release#654）。
        uses: softprops/action-gh-release@v3
        with:
          # body 走文件，避免 GitHub Actions 多行字符串注入陷阱
          body_path: release_notes.md
          # files 用 glob（而非字面路径）：当某个安装包本次未生成（见
          # steps.variants 的 build_pyside / build_winui 开关）时，对应的 glob
          # 匹配为空，配合 fail_on_unmatched_files: false（默认）只记 warning、
          # 不让上传步失败。version 仍通过 tag 锁定，不会误传历史版本。
          fail_on_unmatched_files: false
          files: |
            dist/VibeOCR-Classic-v${{ steps.version.outputs.version }}-win64.zip
            dist/VibeOCR-Classic-v${{ steps.version.outputs.version }}-win64.zip.sha256
            dist/VibeOCR-Next-v${{ steps.version.outputs.version }}-win64.zip
            dist/VibeOCR-Next-v${{ steps.version.outputs.version }}-win64.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------------------------
      # 历史版本清理：发版成功后删除更旧的 GitHub Release，保留最近 5 个
      # -------------------------------------------------------------------
      # 仅删 Release 对象 + 资产（zip/sha256），不删 git tag（--cleanup-tag=false
      # 显式表意）。保留发布历史可追溯，只释放 Release 存储。
      # gh CLI 预装于 windows-latest；GITHUB_TOKEN 由 permissions: contents: write
      # 授权删除。整步 best-effort：单个删除失败仅 ::warning::，不阻断发版
      # （与下方 CNB 镜像步容错策略一致）。

      - name: Cleanup old releases (keep 5)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # 按 semver 数值降序列出已发布 release 的 tag（排除 draft），
          # 保留前 5 个，其余删除。tonumber 按数值比较（v0.10.0 > v0.9.0），
          # 避免字典序把 v0.10.0 排在 v0.9.0 之前。
          mapfile -t all_tags < <(gh release list --json tagName,isDraft \
            --jq '[.[] | select(.isDraft==false) | .tagName] | sort_by(
              ltrimstr("v") | split(".") | map(tonumber)
            ) | reverse | .[]')
          keep=5
          count=${#all_tags[@]}
          echo "共有 $count 个已发布 release，保留最近 $keep 个"
          if [ "$count" -le "$keep" ]; then
            echo "无需清理"
            exit 0
          fi
          deleted=0
          for tag in "${all_tags[@]:$keep}"; do
            echo "删除旧 release: $tag"
            if gh release delete "$tag" --yes --cleanup-tag=false 2>err.log; then
              deleted=$((deleted + 1))
            else
              echo "::warning::删除 release $tag 失败: $(cat err.log)"
            fi
          done
          echo "清理完成，删除了 $deleted 个旧 release"
          exit 0

      # -------------------------------------------------------------------
      # CNB 同步（代码镜像 + Release 产物）
      # -------------------------------------------------------------------
      # 读 secrets.CNB_TOKEN；token 缺失或任一步失败时只发 ::warning::，
      # 不阻断 job。生产仓 feljii/VibeOCR（与 about_tab._CNB_URL 对齐）。

      - name: Mirror code to CNB (all refs)
        id: cnb_mirror
        # actions/checkout@v5 默认浅克隆（fetch-depth:1）且只 fetch 触发的那一个 ref。
        # 这里显式 fetch 全部分支 + tag 到本地 refs，再用 --prune + 显式 refspec 推
        # （见下方说明，为何不用 --mirror）。
        shell: bash
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
        run: |
          if [ -z "$CNB_TOKEN" ]; then
            echo "::warning::未配置 secrets.CNB_TOKEN，跳过 CNB 代码镜像"
            exit 0
          fi

          set +e
          # 补齐完整历史（已完整时该命令无害）
          git fetch --unshallow 2>/dev/null
          # 拉取所有 heads + tag 到本地 refs（checkout 默认不带这些 refspec）
          git fetch --force origin \
            '+refs/heads/*:refs/heads/*' \
            '+refs/tags/*:refs/tags/*'

          CNB_URL="https://oauth2:${CNB_TOKEN}@cnb.cool/feljii/VibeOCR.git"
          # 只推 heads + tags（带 --prune：远端已删的分支/tag 同步删除，等价于
          # --mirror 的清理语义）。不用 --mirror：它会连 refs/remotes/origin/*
          # 这类"远程跟踪引用"一起推，被远端以 "deny updating a hidden ref"
          # 拒收，导致 git exit 1 + 误判镜像失败。CNB 网络偶发超时，最多重试 3 次。
          status=1
          for attempt in 1 2 3; do
            git push --progress --prune "$CNB_URL" \
              '+refs/heads/*:refs/heads/*' \
              '+refs/tags/*:refs/tags/*' && { status=0; break; }
            echo "CNB push 第 $attempt 次失败 (exit $?)，等待后重试..."
            [ "$attempt" -lt 3 ] && sleep $((attempt * 15))
          done
          if [ $status -ne 0 ]; then
            echo "::warning::CNB 代码镜像失败 (3 次重试后仍失败)，不阻断发版"
            exit 0
          fi
          echo "CNB 代码镜像成功"

      # -------------------------------------------------------------------
      # （已移除）Gitee 代码镜像 / Release 同步 / 历史版本清理
      # -------------------------------------------------------------------
      # 产物唯一源改为 GitHub（国内客户端走 gh 代理加速），不再同步到 Gitee。
      # 关于页仍保留 Gitee 仓库链接，仅作代码仓库展示。
