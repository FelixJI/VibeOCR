name: Quality Gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

env:
  # Windows runners otherwise default Python stdout to a legacy code page,
  # and subprocesses need the src-layout package on their import path.
  PYTHONUTF8: "1"
  PYTHONPATH: "${{ github.workspace }}/packages/vibeocr-contracts-py/src;${{ github.workspace }}/packages/vibeocr-client-py/src;${{ github.workspace }}/packages/vibeocr-backend/src;${{ github.workspace }}/apps/vibeocr-pyside/src"

jobs:
  table-contract:
    runs-on: windows-latest
    # Only checked-in synthetic fixtures; no network/model/GPU dependency.
    timeout-minutes: 10
    steps:
      # Checkout first so the runner can resolve the local composite action's
      # action.yml; newer GitHub Actions runners no longer auto-discover it
      # from an empty workspace. The composite re-checkouts at the same depth.
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-buildshell
      - name: Run offline table semantic contract gate
        shell: pwsh
        run: ./scripts/run_table_contract_gate.ps1 -PythonPath python -ReportDir reports/table-contract
      - name: Upload table contract diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: table-contract-diagnostics
          path: |
            reports/table-contract
            tests/fixtures/table_contract
          if-no-files-found: warn
          retention-days: 14

  table-regression:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_call'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-buildshell
      - name: Run expanded table regression matrix
        shell: pwsh
        run: |
          ./scripts/run_table_contract_gate.ps1 -PythonPath python -ReportDir reports/table-regression
          # Table projection coverage is a focused ratchet: raise this threshold
          # when tests improve; never lower it to make a regression green.
          python -m pytest tests/contracts/test_table_contract.py tests/core/test_pipeline_table.py tests/core/test_pipeline_pp_structure_parsing.py tests/core/test_pipeline_paddlocr_vl.py tests/services/test_export_service.py tests/services/test_export_service_extra.py tests/services/test_mineru_service.py tests/supervisor/inference/test_ocr_result_serializer.py tests/supervisor/test_export_route_tables.py tests/utils/test_table_model_html.py tests/utils/test_table_model_reducer.py tests/views/tabs/test_base_tab.py tests/widgets/test_result_view_widget.py -q --cov=vibeocr.tables --cov-branch --cov-report=term-missing --cov-report=xml:reports/table-regression/coverage.xml --cov-fail-under=85 --junitxml=reports/table-regression/junit-expanded.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload table regression diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: table-regression-diagnostics
          path: reports/table-regression
          if-no-files-found: warn
          retention-days: 14

  contracts:
    runs-on: windows-latest
    # 正常 ~1-2min；30min 是宽裕上限，防止偶发环境/依赖拉取卡死烧配额。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "10.0.302" }
      - run: pip install pytest==9.1.1 jsonschema==4.25.1
      - run: python -m pytest tests/contracts -q
      - run: dotnet test tests/dotnet/VibeOCR.Contracts.Tests/VibeOCR.Contracts.Tests.csproj -c Release

  backend:
    runs-on: windows-latest
    # 正常 ~2-3min（800+ 测试 + 构 wheel）；30min 宽裕上限防卡死。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-buildshell
      - run: python -m pytest tests/architecture tests/contracts/v2 tests/application tests/services tests/supervisor tests/test_dependency_bootstrap.py -q
      - name: Run remaining Python unit tests
        shell: pwsh
        run: |
          # Keep C#/WinUI-only checks out of the Python gate. Root-level Python
          # tests are discovered explicitly because pytest path arguments do
          # not expand globs consistently on Windows.
          $excludedRootTests = @('test_soak_winui.py', 'test_upgrade_deps.py')
          $rootTests = @(
            Get-ChildItem -LiteralPath tests -Filter 'test_*.py' |
              Where-Object { $_.Name -notin $excludedRootTests } |
              ForEach-Object { $_.FullName }
          )
          python -m pytest tests/core tests/managers tests/migration tests/models tests/release_layout/test_pyside_frozen_startup.py tests/release_layout/test_pyside_stdio.py tests/ui tests/utils tests/workers @rootTests -q
      - run: pip install build==1.3.0 hatchling==1.27.0
      - uses: ./.github/actions/build-workspace-wheels
      - name: Install root meta wheel in a clean environment
        shell: pwsh
        run: |
          python -m venv .wheel-smoke
          $env:PYTHONPATH = ''
          $workspaceWheels = @(Get-ChildItem -LiteralPath dist/wheels -Filter '*.whl')
          if ($workspaceWheels.Count -ne 6) { throw 'expected exactly six workspace wheels' }
          $wheelPaths = @($workspaceWheels | ForEach-Object { $_.FullName })
          .wheel-smoke\Scripts\python -m pip install @wheelPaths
          .wheel-smoke\Scripts\python -c "import vibeocr, vibeocr.main, vibeocr.supervisor.main, vibeocr.protocol.v2, vibeocr.protocol.v2.client, vibeocr.protocol.v2.mock_server, vibeocr.dependency_bootstrap; print(vibeocr.__version__)"
          .wheel-smoke\Scripts\python -c "import sys; from pathlib import Path; from vibeocr import env_manager; root=env_manager.get_project_root(); assert root == Path(sys.prefix).resolve(); assert env_manager.get_embedded_python_executable(root) == Path(sys.executable).resolve()"
          .wheel-smoke\Scripts\vibeocr-install-backend --help
          if (-not (Test-Path .wheel-smoke\Scripts\vibeocr-supervisor.exe)) { throw 'vibeocr-supervisor console entry point is missing' }

  pyside:
    runs-on: windows-latest
    # 正常 ~2-3min；30min 宽裕上限防卡死。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-buildshell
      - run: python -m pytest tests/views tests/widgets tests/client tests/architecture/test_ui_backend_import_allowlist.py -q
      - run: python -m ruff check apps packages tests scripts

  winui:
    runs-on: windows-latest
    # 仅测试 .NET 契约层（Contracts + Platform）——这是 PySide6 客户端经 IPC
    # 依赖的协议契约，必须保持绿。App.Tests 测的是 WinUI 专属 ViewModel 层
    # （BatchViewModel/PdfViewModel/RecognitionViewModel/Shell/...），这些代码
    # 不进 PySide6 发布包，且其 testhost 在 GitHub Actions 的 Session 0 runner
    # 上会挂起（见 run #29508880539：App.Tests 启动后无输出直到 6h 超时；
    # 本地交互式桌面可正常跑通，无法复现，根因未最终定位）。故 CI 跳过 App.Tests，
    # 仍可本地 `dotnet test src/dotnet/VibeOCR.slnx` 手动验证 WinUI 层。
    # 整个 slnx 仍会被 build，以捕获 App 项目的编译错误。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with: { dotnet-version: "10.0.302" }
      - run: dotnet restore src/dotnet/VibeOCR.slnx --locked-mode
      # build 整个解决方案（含 App + App.Tests，以捕获编译错误），但只 test
      # 两个契约层项目，避开 App.Tests 的 Session 0 挂起。
      - run: dotnet build src/dotnet/VibeOCR.slnx -c Release --no-restore
      - run: |
          dotnet test tests/dotnet/VibeOCR.Contracts.Tests/VibeOCR.Contracts.Tests.csproj -c Release --no-build
          dotnet test tests/dotnet/VibeOCR.Platform.Tests/VibeOCR.Platform.Tests.csproj -c Release --no-build
      - run: node --test tests/web/*.test.ts

  coverage:
    runs-on: windows-latest
    # 全量 Python 单测 + coverage 统计；正常 ~4-5min，30min 宽裕上限防卡死。
    # 本 job 会重跑 backend/pyside/contracts 三 job 的 Python 测试（coverage
    # 需全量数据才有意义），但作为独立 job 并行执行，不拖慢其它 job。
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-buildshell
      - name: Run tests with coverage gate
        shell: pwsh
        run: |
          # 阈值由 pyproject.toml [tool.coverage.report] fail_under 单一控制；
          # pytest-cov 7.x 自动读取，无需此处传 --cov-fail-under。
          # ignore 列表与 qa/coverage.py 的 PYTHON_COVERAGE_IGNORES 保持一致：
          # 排除集成/e2e/parity 等 CI 外的非单测作用域。
          python -m pytest --cov=vibeocr `
            --cov-report=term-missing `
            --cov-report=xml:coverage.xml `
            --ignore=tests/integration `
            --ignore=tests/e2e/winui `
            --ignore=tests/parity `
            --ignore=tests/release_layout/test_winui_layout.py `
            --ignore=tests/test_soak_winui.py `
            --ignore=tests/test_upgrade_deps.py `
            tests/ -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  parity:
    runs-on: windows-latest
    # feature-parity 矩阵校验从 release 迁来。校验矩阵结构 + PASS 行证据齐全，
    # 并跑 tests/parity。不加 --require-pass：表格编辑（WinUI 未实现）当前 PENDING，
    # 硬门会使主干变红；WinUI 成熟到默认随发版时再恢复 --require-pass。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-buildshell
      - name: Validate feature-parity matrix
        shell: bash
        run: |
          python tests/parity/validate_matrix.py docs/quality/feature-parity.md
          python -m pytest tests/parity -q
