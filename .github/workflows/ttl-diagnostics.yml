name: TTL Diagnostics

on:
  push:
    branches:
      - agent/fix-persistent-model-residency
  pull_request:
    paths:
      - ".github/workflows/ttl-diagnostics.yml"
      - "packages/vibeocr-backend/src/vibeocr/services/**"
      - "packages/vibeocr-backend/src/vibeocr/workers/**"
      - "tests/services/test_*ttl*.py"
      - "tests/services/test_worker_runtime_residency.py"
      - "tests/services/test_pipeline_cache_manager.py"

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: windows-2025
    env:
      PYTHONUTF8: "1"
      PYTHONPATH: >-
        ${{ github.workspace }}/packages/vibeocr-contracts-py/src;
        ${{ github.workspace }}/packages/vibeocr-client-py/src;
        ${{ github.workspace }}/packages/vibeocr-backend/src;
        ${{ github.workspace }}/apps/vibeocr-pyside/src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install build shell
        run: pip install --require-hashes -r requirements/build-shell.lock
      - name: Run backend and lint diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $log = "ttl-diagnostics.txt"
          python -m pytest `
            tests/architecture `
            tests/supervisor `
            tests/application `
            tests/services `
            tests/test_dependency_bootstrap.py `
            -q *>&1 | Tee-Object -FilePath $log
          $testExit = $LASTEXITCODE

          python -m ruff check `
            packages/vibeocr-backend/src/vibeocr/services/pipeline_cache_manager.py `
            tests/services/test_pipeline_cache_manager.py `
            *>&1 | Tee-Object -FilePath $log -Append
          $lintExit = $LASTEXITCODE

          "pytest_exit=$testExit ruff_exit=$lintExit" | Tee-Object -FilePath $log -Append
          if ($testExit -ne 0 -or $lintExit -ne 0) { exit 1 }
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttl-diagnostics
          path: ttl-diagnostics.txt
          if-no-files-found: error
