[project]
name = "vibeocr-pyside"
version = "0.6.1"
description = "VibeOCR PySide6 Classic desktop shell"
requires-python = ">=3.13,<3.14"
dependencies = [
    "vibeocr-client-py==0.6.1",
    "vibeocr-contracts-py==0.6.1",
    "pyside6>=6.11.1",
    "qasync>=0.28.0",
    "numpy>=2.3.5",
    "pymupdf>=1.28.0",
]

[project.scripts]
vibeocr = "vibeocr.main:main"

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeocr"]
