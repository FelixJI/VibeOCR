[project]
name = "vibeocr-pyside"
version = "0.4.28"
description = "VibeOCR PySide6 Classic desktop shell"
requires-python = ">=3.13,<3.14"
dependencies = [
    "vibeocr-client-py==0.4.28",
    "vibeocr-contracts-py==0.4.28",
    "pyside6>=6.11.1",
    "qasync>=0.28.0",
]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeocr_pyside"]
