[project]
name = "vibeocr"
version = "0.1.0"
description = "A screenshot OCR application"
requires-python = ">=3.13,<3.14"
dependencies = [
    # 运行时依赖
    "pyside6>=6.11.0",
    "pillow>=12.2.0",
    "numpy>=2.4.4",
    "markdown>=3.10.2",
    "qasync>=0.28.0",
    "paddlepaddle-gpu>=3.3.1",
    "nvidia-cudnn-cu13>=9.13.0.50",
    "nvidia-cublas>=13.0.2.14",
    "nvidia-cufft>=12.0.0.61",
    "nvidia-curand>=10.4.0.35",
    "nvidia-cusolver>=12.0.4.66",
    "nvidia-cusparse>=12.6.3.3",
    "nvidia-cuda-runtime>=13.0.88",
    "paddlex[ocr]>=3.4.3",
    "httpx>=0.28.1",
    "mineru[core]>=3.1.0",
    # 开发依赖
    "pytest>=9.0.3",
    "pytest-qt>=4.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.11",
    "pyright>=1.1.408",
    "pre-commit>=4.5.1",
    "uv>=0.11.7",
]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

# =============================================================================
# Ruff - Linter + Formatter
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff 特定规则
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "DTZ",    # flake8-datetimez
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "YTT",    # flake8-2020
]
ignore = [
    "E501",     # 行长度由 formatter 处理
    "COM812",   # 与 formatter 冲突
    "B008",     # 函数调用作为默认参数（Qt 信号/槽）
    "RUF001",   # 中文全角字符
    "RUF002",
    "RUF003",
    "RUF012",   # 类属性可变默认值（Qt/PySide 模式）
    "PTH123",   # open() vs Path.open()（现有代码风格）
    "DTZ005",   # datetime.now() 时区（本地时间足够）
    "DTZ006",   # datetime.fromtimestamp() 时区
    "ARG001",   # 未使用的函数参数（接口兼容性）
    "ARG002",   # 未使用的方法参数（Qt 覆盖）
    "ARG004",   # 未使用的静态方法参数
    "ARG005",   # 未使用的 lambda 参数
    "SIM102",   # 嵌套 if 语句（可读性）
    "SIM105",   # contextlib.suppress（可读性）
    "B905",     # zip() strict 参数（现有代码风格）
    "UP046",    # Generic 类型参数（兼容性）
]

[tool.ruff.lint.isort]
known-first-party = ["vibeocr"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG", "PLR2004"]
"__init__.py" = ["F401"]

# =============================================================================
# Pyright - 静态类型检查
# =============================================================================
[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "Windows"
typeCheckingMode = "standard"
include = ["src"]
exclude = [".venv", "**/__pycache__"]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = "error"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "error"
# PySide6 自动生成的 UI 文件使用旧式枚举访问
reportAttributeAccessIssue = "warning"

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyside6"
addopts = "-v --tb=short"

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# =============================================================================
# uv 配置
# =============================================================================
[tool.uv]
environments = ["sys_platform == 'win32'"]
extra-index-url = [
    "https://mirrors.aliyun.com/pypi/simple",
    "https://www.paddlepaddle.org.cn/packages/stable/cu129/",
]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
