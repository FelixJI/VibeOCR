[project]
name = "vibeocr"
version = "0.1.0"
description = "A screenshot OCR application"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 开发环境依赖 (CUDA 12)
    "pyside6>=6.10.2",
    "pillow>=11.0.0",
    "numpy>=1.26.0",
    "markdown>=3.4",
    "qasync>=0.27.0",
    "paddlepaddle-gpu>=3.3.0",
    "nvidia-cudnn-cu12",
    "paddlex[ocr]>=3.4.2",
    "paddlex[ie]>=3.4.2",
    "paddlex[multimodal]>=3.4.2",
    "uv>=0.10.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyside6"
addopts = "-v --tb=short"

# uv 包管理器配置 - PaddlePaddle CUDA 12 镜像源
[tool.uv]
extra-index-url = [
    "https://www.paddlepaddle.org.cn/packages/stable/cu129/",
    "https://pypi.org/simple",
]
index-strategy = "unsafe-best-match"
