[project]
name = "vibeocr"
version = "0.1.0"
description = "A screenshot OCR application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyside6>=6.8.0",
    "rapidocr>=3.6.0",
    "pillow>=11.0.0",
]

[project.scripts]
vibeocr = "vibeocr.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeocr"]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyside6"
addopts = "-v --tb=short"
