[project]
name = "vibeocr"
version = "0.5.6"
description = "A screenshot OCR application"
authors = [{name = "Felix Ji"}]
requires-python = ">=3.13,<3.14"
dependencies = [
    "vibeocr-contracts-py==0.5.6",
    "vibeocr-client-py==0.5.6",
    "vibeocr-backend==0.5.6",
    "vibeocr-pyside==0.5.6",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-qt>=4.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "pyright>=1.1.409",
    "pre-commit>=4.6.0",
    "uv>=0.11.14",
    # 程序内更新链路的打包步骤（bump_version.py --build/--release）依赖它。
    # >=6.6：bump_version 打包注入 --optimize 2（字节码优化），该参数自此版本引入。
    "pyinstaller>=6.6",
    # Supervisor HTTP v2 跨语言契约校验。C# 端做语义 JSON 比较，
    # Python 端用 JSON Schema (Draft 2020-12) 校验 job/errors/golden。
    "jsonschema>=4.25.0",
    # Supervisor lifecycle 是 asyncio；测试用 pytest-asyncio。
    "pytest-asyncio>=1.2.0",
]
lint = ["ruff>=0.15.13", "pyright>=1.1.409"]
test-contracts = ["pytest>=9.0.3", "jsonschema>=4.25.0"]
test-backend = ["pytest>=9.0.3", "pytest-asyncio>=1.2.0"]
test-pyside = ["pytest>=9.0.3", "pytest-qt>=4.5.0"]
build-common = ["hatchling>=1.0.0", "uv>=0.11.14"]
build-pyside = ["pyinstaller>=6.6"]
build-winui = []

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

# =============================================================================
# Ruff - Linter + Formatter
# =============================================================================
[tool.ruff]
target-version = "py313"
line-length = 88
# scripts/ 含 PowerShell 等非 Python 脚本；ruff 只检查 .py。
extend-exclude = ["*.ps1", "*.sh", "*.cmd", "*.bat"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff 特定规则
    "A",      # flake8-builtins
    "COM",    # flake8-commas
    "DTZ",    # flake8-datetimez
    "PIE",    # flake8-pie
    "RET",    # flake8-return
    "YTT",    # flake8-2020
]
ignore = [
    "E501",     # 行长度由 formatter 处理
    "COM812",   # 与 formatter 冲突
    "B008",     # 函数调用作为默认参数（Qt 信号/槽）
    "RUF001",   # 中文全角字符
    "RUF002",
    "RUF003",
    "RUF012",   # 类属性可变默认值（Qt/PySide 模式）
    "PTH123",   # open() vs Path.open()（现有代码风格）
    "DTZ005",   # datetime.now() 时区（本地时间足够）
    "DTZ006",   # datetime.fromtimestamp() 时区
    "DTZ011",   # date.today() 时区（版权年份/changelog 用本地日期即可）
    "ARG001",   # 未使用的函数参数（接口兼容性）
    "ARG002",   # 未使用的方法参数（Qt 覆盖）
    "ARG004",   # 未使用的静态方法参数
    "ARG005",   # 未使用的 lambda 参数
    "SIM102",   # 嵌套 if 语句（可读性）
    "SIM105",   # contextlib.suppress（可读性）
    "B905",     # zip() strict 参数（现有代码风格）
    "UP046",    # Generic 类型参数（兼容性）
]

[tool.ruff.lint.isort]
known-first-party = ["vibeocr"]

[tool.ruff.lint.per-file-ignores]
# S101: assert 在测试中是断言；ARG: 测试固件常留未用参数；PLR2004: 魔法数字
# SIM117: 测试中嵌套 patch 上下文管理器可读性优于合并（3+ 层 patch）
"tests/*" = ["S101", "ARG", "PLR2004", "SIM117"]
"__init__.py" = ["F401"]
# pyside6-uic 生成代码，源文件是同目录 .ui；不要手工格式化生成物。
"apps/vibeocr-pyside/src/vibeocr/ui/ui_*.py" = ["ALL"]

# =============================================================================
# Pyright - 静态类型检查
# =============================================================================
[tool.pyright]
pythonVersion = "3.13"
pythonPlatform = "Windows"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = ["apps", "packages", "scripts", "tests", "qa", "examples"]
exclude = [".venv", "**/__pycache__"]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = "error"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "error"
# PySide6 自动生成的 UI 文件使用旧式枚举访问
reportAttributeAccessIssue = "warning"

# =============================================================================
# Mypy - 静态类型检查
# =============================================================================
[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "paddleocr",
    "fitz",
    "docx",
    "docx.shared",
    "openpyxl",
    "markdown",
    "markdown.extensions.*",
    "qrcode",
    "pyzbar",
    "pyzbar.pyzbar",
    "pyzbar.symbols",
    "qrcode.image.svg",
    "barcode",
    "barcode.writer",
    "pynvml",
    "qasync",
    "oleacc",
]
ignore_missing_imports = true

# =============================================================================
# Pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyside6"
addopts = "-v --tb=short -m 'not slow'"
# Supervisor lifecycle tests are asyncio; auto mode collects coroutines
# as async tests without per-test markers.
asyncio_mode = "auto"
markers = [
    # 端到端烟雾测试（启动真实子进程，较慢）；默认跳过，需 -m "slow" 显式运行。
    "slow: end-to-end tests that spawn real subprocesses",
]
pythonpath = [
    "packages/vibeocr-contracts-py/src",
    "packages/vibeocr-client-py/src",
    "packages/vibeocr-backend/src",
    "apps/vibeocr-pyside/src",
]

# =============================================================================
# Coverage
# =============================================================================
[tool.coverage.run]
source = ["vibeocr"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
# 覆盖率门禁基线（ratchet：只升不降，防回归）。pytest-cov 7.x 会自动读取本值，
# 无需在命令行重复传 --cov-fail-under——本地 ``python qa/coverage.py`` 与 CI
# coverage job 都以这里为单一真相源。调高时改这一处即可。
# 当前实测 70.07%，设 70 为防回归基线。目标 75%，
# 需补约 580 行覆盖（集中在 services/workers/main 等 CUDA/GPU/Qt 环境依赖型
# 代码），按多轮补测推进后逐步调高本值。
fail_under = 70

# =============================================================================
# uv 配置
# =============================================================================
[tool.uv]
override-dependencies = [
    "opencv-python ; sys_platform == 'nonexistent'",
    # torchvision 是 torch 的传递依赖。unsafe-best-match + index-strategy 下，
    # PyPI 的 CPU 版 torchvision==0.27.1（无后缀）在 PEP 440 排序中高于
    # 南大镜像的 0.27.1+cu126（local version 排序靠后），uv 会误选 CPU 版。
    # 而 torch 是 CUDA 版，torchvision 必须同为 cu126 才能配套 CUDA ops。
    # PEP 440 禁止在 >= 等「范围」操作符上使用 local version（+cu126），
    # 故只能用 == 精确锁定；升级 torch 时需同步手动更新这里的版本号。
    "torchvision==0.27.1+cu126",
]
environments = ["sys_platform == 'win32'"]
extra-index-url = [
    "https://mirrors.aliyun.com/pypi/simple",
    "https://www.paddlepaddle.org.cn/packages/stable/cu126/",
]
index-strategy = "unsafe-best-match"

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
vibeocr-contracts-py = { workspace = true }
vibeocr-client-py = { workspace = true }
vibeocr-backend = { workspace = true }
vibeocr-pyside = { workspace = true }

# paddlepaddle-gpu 和 torch 都用 CUDA 12.6 构建（cu126），保持同源：
# - paddle cu126 找 cublas64_12.dll，torch cu126 的 torch/lib 正好提供
# - 不用 cu129/cu130：cu129 paddle 要 cu12 DLL 但 torch 无 cu129 win wheel；
#   cu130 paddle 要 cublas64_13.dll，与 torch/lib 的 _12 系列 ABI 不匹配
#
# torch/torchvision 的 +cu126 变体不在 PyPI（PyPI 默认版是 CPU 版），必须走
# PyTorch 官方 whl index 或其镜像。开发环境在国内，统一走南大镜像
# （与便携环境 env_config 的 PYTORCH_MIRROR_SOURCES["nju"] 对齐，国内加速）。
# 单一 source，uv 不要求 platform marker；index 保持 explicit=true，
# 仅对显式声明的 torch/torchvision 生效，不污染其它包的解析。
torch = { index = "pytorch-cu126-nju" }
torchvision = { index = "pytorch-cu126-nju" }

[[tool.uv.index]]
name = "pytorch-cu126-nju"
url = "https://mirrors.nju.edu.cn/pytorch/whl/cu126"
explicit = true
