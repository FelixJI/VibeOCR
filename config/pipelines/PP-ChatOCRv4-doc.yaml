# PP-ChatOCRv4 文档场景信息抽取配置
# 使用最新版本模型

pipeline_name: PP-ChatOCRv4-doc

use_layout_parser: True
use_mllm_predict: True

SubModules:
  LLM_Chat:
    module_name: chat_bot
    model_name: ernie-3.5-8k
    base_url: "https://qianfan.baidubce.com/v2"
    api_type: openai
    api_key: "api_key"

  LLM_Retriever:
    module_name: retriever
    model_name: embedding-v1
    base_url: "https://qianfan.baidubce.com/v2"
    api_type: qianfan
    api_key: "api_key"

  MLLM_Chat:
    module_name: chat_bot
    model_name: PP-DocBee
    base_url: "http://127.0.0.1:8080/v1/chat/completions"
    api_type: openai
    api_key: "api_key"

  PromptEngneering:
    KIE_CommonText:
      module_name: prompt_engneering
      task_type: text_kie_prompt_v2
      task_description: '你现在的任务是从OCR结果中提取问题列表中每一个问题的答案。
          OCR的文字识别结果使用```符号包围，包含所识别出来的文字，顺序在原始图片中从左至右、从上至下。
          我指定的问题列表使用[]符号包围。'
      output_format: '在返回结果时使用JSON格式，包含多个key-value对。'
      rules_str: '每个问题的答案用OCR结果的内容回答，针对问题回答尽可能详细和完整。'
      few_shot_demo_text_content:
      few_shot_demo_key_value_list:

    KIE_Table:
      module_name: prompt_engneering
      task_type: table_kie_prompt_v2
      task_description: '你现在的任务是从输入的html格式的表格内容中提取问题列表中每一个问题的答案。'
      output_format: '在返回结果时使用JSON格式。'
      rules_str: '每个问题的答案用表格内容回答。'
      few_shot_demo_text_content:
      few_shot_demo_key_value_list:

    Ensemble:
      module_name: prompt_engneering
      task_type: ensemble_prompt
      task_description: '对于一个问题，对比方法A和方法B的结果，选择更准确的一个回答。'
      output_format: '请返回JSON格式的结果。'
      rules_str: '对于涉及数字的问题，请返回与问题描述最相关且数字表述正确的答案。'
      few_shot_demo_text_content:
      few_shot_demo_key_value_list:

SubPipelines:
  LayoutParser:
    pipeline_name: layout_parsing
    use_doc_preprocessor: True
    use_general_ocr: True
    use_seal_recognition: True
    use_table_recognition: True
    use_formula_recognition: False

    SubModules:
      LayoutDetection:
        module_name: layout_detection
        model_name: PP-DocLayout_plus-L  # 使用更高精度模型
        model_dir: null

    SubPipelines:
      DocPreprocessor:
        pipeline_name: doc_preprocessor
        use_doc_orientation_classify: True
        use_doc_unwarping: True
        SubModules:
          DocOrientationClassify:
            module_name: doc_text_orientation
            model_name: PP-LCNet_x1_0_doc_ori
            model_dir: null
          DocUnwarping:
            module_name: image_unwarping
            model_name: UVDoc
            model_dir: null

      GeneralOCR:
        pipeline_name: OCR
        text_type: general
        use_doc_preprocessor: False
        use_textline_orientation: False
        SubModules:
          TextDetection:
            module_name: text_detection
            model_name: PP-OCRv5_server_det
            model_dir: null
            limit_side_len: 960
            limit_type: max
            thresh: 0.3
            box_thresh: 0.6
            unclip_ratio: 2.0
          TextRecognition:
            module_name: text_recognition
            model_name: PP-OCRv5_server_rec
            model_dir: null
            batch_size: 6
            score_thresh: 0.0

      TableRecognition:
        pipeline_name: table_recognition_v2
        use_layout_detection: False
        use_doc_preprocessor: False
        use_ocr_model: False
        SubModules:
          TableStructureRecognition:
            module_name: table_structure_recognition
            model_name: SLANeXt_wired  # 新一代模型
            model_dir: null

      SealRecognition:
        pipeline_name: seal_recognition
        use_layout_detection: False
        use_doc_preprocessor: False
        SubPipelines:
          SealOCR:
            pipeline_name: OCR
            text_type: seal
            use_doc_preprocessor: False
            use_textline_orientation: False
            SubModules:
              TextDetection:
                module_name: seal_text_detection
                model_name: PP-OCRv4_server_seal_det
                model_dir: null
                limit_side_len: 736
                limit_type: min
                thresh: 0.2
                box_thresh: 0.6
                unclip_ratio: 0.5
              TextRecognition:
                module_name: text_recognition
                model_name: PP-OCRv5_server_rec
                model_dir: null
                batch_size: 1
                score_thresh: 0
