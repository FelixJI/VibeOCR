# 表格识别 V2 管道配置
# 使用 SLANeXt 新一代表格结构识别模型

pipeline_name: table_recognition_v2

use_doc_preprocessor: True
use_layout_detection: True
use_ocr_model: True

SubModules:
  LayoutDetection:
    module_name: layout_detection
    model_name: PP-DocLayout_plus-L  # 83.2% mAP，更高精度
    model_dir: null

  TableClassification:
    module_name: table_classification
    model_name: PP-LCNet_x1_0_table_cls  # 94.2% Acc
    model_dir: null

  # 新一代表格结构识别模型，分有线/无线专用权重
  WiredTableStructureRecognition:
    module_name: table_structure_recognition
    model_name: SLANeXt_wired  # 新一代，有线表格专用
    model_dir: null

  WirelessTableStructureRecognition:
    module_name: table_structure_recognition
    model_name: SLANeXt_wireless  # 新一代，无线表格专用
    model_dir: null

  # 表格单元格检测
  WiredTableCellsDetection:
    module_name: table_cells_detection
    model_name: RT-DETR-L_wired_table_cell_det  # 82.7% mAP
    model_dir: null

  WirelessTableCellsDetection:
    module_name: table_cells_detection
    model_name: RT-DETR-L_wireless_table_cell_det  # 82.7% mAP
    model_dir: null

SubPipelines:
  DocPreprocessor:
    pipeline_name: doc_preprocessor
    use_doc_orientation_classify: True
    use_doc_unwarping: True
    SubModules:
      DocOrientationClassify:
        module_name: doc_text_orientation
        model_name: PP-LCNet_x1_0_doc_ori
        model_dir: null
      DocUnwarping:
        module_name: image_unwarping
        model_name: UVDoc
        model_dir: null

  GeneralOCR:
    pipeline_name: OCR
    text_type: general
    use_doc_preprocessor: False
    use_textline_orientation: False
    SubModules:
      TextDetection:
        module_name: text_detection
        model_name: PP-OCRv5_server_det
        model_dir: null
        limit_side_len: 960
        limit_type: max
        thresh: 0.3
        box_thresh: 0.4
        unclip_ratio: 2.0
      TextRecognition:
        module_name: text_recognition
        model_name: PP-OCRv5_server_rec
        model_dir: null
        batch_size: 1
        score_thresh: 0
