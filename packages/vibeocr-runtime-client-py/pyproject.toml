[project]
name = "vibeocr-runtime-client"
version = "2.0.0"
description = "Python transport client and mock server for the VibeOCR Runtime Protocol"
requires-python = ">=3.13,<3.14"
dependencies = [
    "vibeocr-runtime-contracts==2.0.0",
    "httpx>=0.28.1",
    "jsonschema>=4.25.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeocr"]
