[project]
name = "vibeocr-client-py"
version = "0.5.3"
description = "Python Named Pipe/shared-memory WorkerHost client"
requires-python = ">=3.13,<3.14"
dependencies = [
    "vibeocr-contracts-py==0.5.3",
    "pydantic>=2.13.4",
    "httpx>=0.28.1",
    "packaging>=24.0",
    "pillow>=12.3.0",
    "markdown>=3.10.2",
    "fonttools>=4.63.0",
]

[project.scripts]
vibeocr-install-backend = "vibeocr.dependency_bootstrap:main"

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeocr"]
