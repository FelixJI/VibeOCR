[project]
name = "vibeocr-contracts-py"
version = "0.5.6"
description = "Qt-free VibeOCR protocol and DTO contracts"
requires-python = ">=3.13,<3.14"
dependencies = []

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibeocr"]

[tool.hatch.build.targets.wheel.force-include]
"src/vibeocr/protocol/v2/errors.json" = "vibeocr/protocol/v2/errors.json"
"src/vibeocr/protocol/v2/openapi.snapshot.json" = "vibeocr/protocol/v2/openapi.snapshot.json"
"src/vibeocr/protocol/v2/golden/golden.json" = "vibeocr/protocol/v2/golden/golden.json"
"src/vibeocr/protocol/v2/schemas/errors.schema.json" = "vibeocr/protocol/v2/schemas/errors.schema.json"
"src/vibeocr/protocol/v2/schemas/job.schema.json" = "vibeocr/protocol/v2/schemas/job.schema.json"
