# Pre-commit 配置
# =============================================================================
# 分级策略：
# - P0 (阻塞): Ruff 代码检查 + 格式化
# - P1 (警告): 类型检查 (mypy)
# - P2 (警告): 其他检查
# =============================================================================

repos:
# =============================================================================
# P0 - 阻塞级检查（必须通过）
# =============================================================================
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.4
  hooks:
  # Ruff 检查 - 自动修复
  - id: ruff
    args: [--fix, --exit-non-zero-on-fix]
  # Ruff 格式化
  - id: ruff-format

# =============================================================================
# P1 - 类型检查（警告级别，不阻塞提交）
# =============================================================================
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.19.1
  hooks:
  - id: mypy
    args: [--ignore-missing-imports, --config-file=pyproject.toml]
    additional_dependencies:
      - types-Markdown
    files: ^src/
    verbose: true
    # 类型检查作为警告，不阻塞提交
    # 如需严格模式，取消下面的注释
    # stages: [manual]

# =============================================================================
# P2 - 通用检查
# =============================================================================
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  # 代码质量
  - id: check-ast              # 确保 Python 文件语法正确
  - id: debug-statements       # 检查调试语句 (pdb, breakpoint)
  # 文件格式
  - id: trailing-whitespace
  - id: end-of-file-fixer
  # 配置文件
  - id: check-yaml
  - id: check-json
  - id: check-toml
  # 其他
  - id: check-added-large-files
    args: ['--maxkb=5000']
  - id: check-merge-conflict
  - id: check-case-conflict    # 检查文件名大小写冲突
